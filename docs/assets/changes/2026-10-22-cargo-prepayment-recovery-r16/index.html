<main><h1>화물 선결제 접수·결과 확인</h1>
<p>제품의 공통 Razor 결제 화면을 로컬 브라우저에서 가상 API·휘발 저장소로 확인한 기록입니다. 실제 결제·송금·휴대폰 화면·제품 API 통신의 증거와 구분합니다. 화면의 시험 금액은 12,000원입니다.</p>
<div class="screens">
<figure><figcaption>1. 결제 전 · 접수 준비</figcaption><a href="01-prepayment-ready.png"><img src="01-prepayment-ready.png" alt="금액과 시험 결제하고 접수 버튼이 보이는 결제 대기 화면"></a><small>실제 결제 없음 안내와 결과 확인 버튼을 표시합니다.</small></figure>
<figure><figcaption>2. 서버 확인 후 · 배차 인계</figcaption><a href="02-prepayment-confirmed.png"><img src="02-prepayment-confirmed.png" alt="시험 결제 확인과 매칭중 상태 화면"></a><small>결제 승인 응답 뒤 같은 의뢰를 재조회한 결과입니다. 실제 배차 실행은 별도 서버 회귀로 확인합니다.</small></figure>
<figure><figcaption>3. 시간초과 · 결과 확인 안내</figcaption><a href="03-payment-result-dialog.png"><img src="03-payment-result-dialog.png" alt="운송 접수 결과 확인 필요 대화상자"></a><small>재결제를 유도하지 않고 같은 업무의 결과 확인을 안내합니다.</small></figure>
<figure><figcaption>4. 대화상자 닫기 · 기존 업무 유지</figcaption><a href="04-payment-result-check.png"><img src="04-payment-result-check.png" alt="결과 미확정으로 결제 버튼이 비활성화된 결제 화면"></a><small>결과가 확인될 때까지 시험 결제 버튼을 막고 결과 확인을 제공합니다.</small></figure>
