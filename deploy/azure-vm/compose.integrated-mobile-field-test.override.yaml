{
  "name": "mirror-integrated-field-test",
  "x-mirror-field-test": {
    "stage": "IsolatedSyntheticFieldTest",
    "executionMode": "Simulation",
    "availability": "24h",
    "apiInstances": 1,
    "autoShutdown": false,
    "automaticDispatchEnabled": false,
    "financialExecutionEnabled": false,
    "weeklyPreparationEnabled": false,
    "allHostedServicesDisabled": false,
    "generalProjectionAndInboxWorkersMayRun": true,
    "realFcmOneShotVerification": "SeparateAuthorizedHarness",
    "publicReleaseReady": false
  },
  "services": {
    "mysql": { "mem_limit": "2g", "environment": { "MYSQL_DATABASE": "mirror_integrated_field_test" } },
    "mongo": { "mem_limit": "1g", "environment": { "MONGO_INITDB_DATABASE": "mirror_integrated_field_test" } },
    "app": {
      "mem_limit": "2g",
      "deploy": { "replicas": 1 },
      "environment": {
        "ASPNETCORE_ENVIRONMENT": "Staging",
        "SsalddelExecution__Mode": "Simulation",
        "ConnectionStrings__DefaultConnection": "server=mysql;port=3306;database=mirror_integrated_field_test;user=ssalddel;password=${SSALDDEL_MYSQL_PASSWORD};SslMode=None;AllowPublicKeyRetrieval=True;",
        "MongoDb__Database": "mirror_integrated_field_test",
        "DatabaseInitialization__RunAtStartup": "false",
        "DatabaseInitialization__FailOnError": "true",
        "Jwt__Issuer": "Mirror.IntegratedFieldTest",
        "Jwt__Audience": "Mirror.IntegratedFieldTest.Clients",
        "PersonalDataProtection__ApplicationName": "Mirror.IntegratedFieldTest",
        "ObjectStorage__Provider": "GoogleCloud",
        "GoogleCloudStorage__BucketName": "${MIRROR_FIELD_PRIVATE_BUCKET:?private synthetic field-test bucket required}",
        "GoogleCloudStorage__PrivateBucketName": "${MIRROR_FIELD_PRIVATE_BUCKET:?private synthetic field-test bucket required}",
        "GoogleCloudStorage__PublicBucketName": "",
        "GoogleCloudStorage__PublicBaseUrl": "",
        "GoogleCloudStorage__ServiceAccountJsonPath": "/run/secrets/mirror-storage-service-account.json",
        "PushNotifications__ProjectId": "${MIRROR_FIREBASE_PROJECT_ID:?explicit Firebase project required}",
        "PushNotifications__ServiceAccountJsonPath": "/run/secrets/mirror-push-service-account.json",
        "PushNotifications__ServerKey": "",
        "AzureBlobStorage__ServiceUri": "",
        "AzureBlobStorage__PublicContainerName": "",
        "AzureBlobStorage__PrivateContainerName": "",
        "MobileFieldTest__Enabled": "true",
        "NeighborhoodMemberDelivery__Enabled": "true",
        "NeighborhoodMemberDelivery__OperationalEnabled": "false",
        "MobileFieldTest__FoodDispatch__Enabled": "false",
        "MobileFieldTest__FoodDispatch__BootstrapSyntheticDriverState": "false",
        "MobileFieldTest__FoodDispatch__RefreshSyntheticDriverLocation": "false",
        "FoodObserverVerification__Enabled": "false",
        "ObservableOperationsVerification__Enabled": "false",
        "FulfillmentRouting__Enabled": "false",
        "FreightContinuity__Enabled": "false",
        "FreightContinuity__ShadowMode": "true",
        "SharedDriverWork__Enabled": "false",
        "TransportPrepayment__Enabled": "false",
        "DriverPayoutBatch__Enabled": "false",
        "DriverPayoutBatch__AutomaticPreparationEnabled": "false",
        "DistributedFulfillment__Enabled": "false",
        "NeighborhoodSettlement__Enabled": "false",
        "TossPayments__ClientKey": "",
        "TossPayments__SecretKey": "",
        "OperationsAlerts__Enabled": "false",
        "OperationsAlerts__ExternalSendEnabled": "false",
        "AgriculturalFisheriesBatch__Enabled": "false",
        "CommunityEditorialBatch__Enabled": "false",
        "CommunityEditorialBatch__WeeklyCountryProductComparisonEnabled": "false",
        "CommunityPostTranslation__Enabled": "false",
        "CommunityPostEmailNotifications__Enabled": "false",
        "SalesChannelOrderSync__Enabled": "false",
        "WorkRelationshipSnapshots__Enabled": "false",
        "YouTube__Enabled": "false",
        "HongikHakdangCards__Enabled": "false",
        "IdentitySeed__BootstrapAdmin__Enabled": "false",
        "IdentitySeed__DevelopmentAccounts__Enabled": "true",
        "IdentitySeed__DevelopmentAccounts__AllowInSimulation": "true",
        "IdentitySeed__DevelopmentAccounts__AdminPassword": "${SSALDDEL_FIELD_ADMIN_PASSWORD:?synthetic administrator password required}",
        "IdentitySeed__DevelopmentAccounts__OrdererPassword": "${SSALDDEL_FIELD_ORDERER_PASSWORD:?synthetic orderer password required}",
        "IdentitySeed__DevelopmentAccounts__DriverPassword": "${SSALDDEL_FIELD_DRIVER_PASSWORD:?synthetic driver password required}",
        "IdentitySeed__DevelopmentAccounts__ShipperPassword": "${SSALDDEL_FIELD_RESTAURANT_PASSWORD:?synthetic restaurant password required}",
        "VersionFeatureFlags__CommunityTrustWorkflow": "true",
        "VersionFeatureFlags__DomesticTransportWorkflow": "true",
        "VersionFeatureFlags__FoodDeliveryWorkflow": "true",
        "VersionFeatureFlags__PlatformOperationsControl": "true",
        "VersionFeatureFlags__WarehouseFulfillmentWorkflow": "false",
        "VersionFeatureFlags__SalesChannelFulfillmentWorkflow": "false",
        "VersionFeatureFlags__HrParticipationWorkflow": "false",
        "VersionFeatureFlags__SsalddelMartWorkflow": "false",
        "VersionFeatureFlags__GroupPurchaseDemandWorkflow": "false",
        "VersionFeatureFlags__GroupPurchasePracticeWorkflow": "false",
        "VersionFeatureFlags__CustomsAndTradeDataWorkflow": "false"
      },
      "volumes": [
        { "type": "bind", "source": "${MIRROR_STORAGE_SERVICE_ACCOUNT_FILE:?external storage credential file required}", "target": "/run/secrets/mirror-storage-service-account.json", "read_only": true, "bind": { "create_host_path": false } },
        { "type": "bind", "source": "${MIRROR_PUSH_SERVICE_ACCOUNT_FILE:?external push credential file required}", "target": "/run/secrets/mirror-push-service-account.json", "read_only": true, "bind": { "create_host_path": false } }
      ]
    }
  },
  "volumes": {
    "mysql_data": { "name": "mirror-integrated-field-test-mysql-data" },
    "mongo_data": { "name": "mirror-integrated-field-test-mongo-data" },
    "app_data": { "name": "mirror-integrated-field-test-app-data" },
    "app_uploads": { "name": "mirror-integrated-field-test-app-uploads" },
    "caddy_data": { "name": "mirror-integrated-field-test-caddy-data" },
    "caddy_config": { "name": "mirror-integrated-field-test-caddy-config" }
  }
}
