global
    maxconn 128
defaults
    mode tcp
    timeout connect 5s
    timeout client 60s
    timeout server 60s
frontend mysql_front
    bind *:3306
    default_backend mysql_back
backend mysql_back
    server mysql mysql:3306
frontend mongo_front
    bind *:27017
    default_backend mongo_back
backend mongo_back
    server mongo mongo:27017
