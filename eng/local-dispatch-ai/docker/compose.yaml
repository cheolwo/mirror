# 합성 집계 참고용 로컬 런타임. 자동 재시작과 운영 효과는 사용하지 않는다.
name: mirror-local-dispatch-ai

services:
  ollama:
    image: ${OLLAMA_IMAGE:?Set the locally verified image digest in the ignored .env file}
    pull_policy: never
    profiles: [local-ai]
    restart: "no"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MODELS: "/models"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    ports:
      - "127.0.0.1:12681:11434"
    volumes:
      - type: volume
        source: ollama-models
        target: /models
      - type: volume
        source: ollama-state
        target: /root/.ollama
    networks: [local-api]
    cpus: 4
    mem_limit: 6g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      kr.ssalddel.purpose: synthetic-dispatch-advisory-only
      kr.ssalddel.operational-effects: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  ollama-models:
  ollama-state:

networks:
  local-api:
    driver: bridge
