name: Release readiness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip

jobs:
  version-readiness:
    name: Version builds, tests, and publish
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET workloads
        run: dotnet workload restore Ssalddel.v3.5.slnx

      - name: Install WebAssembly publish tools
        run: dotnet workload install wasm-tools --skip-manifest-update --verbosity minimal

      - name: Restore version 0.0 slice
        run: >-
          dotnet restore Ssalddel.v0.0.slnx
          --artifacts-path artifacts/build/v0
          --property:Configuration=Release

      - name: Restore version 0.5 slice
        run: >-
          dotnet restore Ssalddel.v0.5.slnx
          --artifacts-path artifacts/build/v05
          --property:Configuration=Release

      - name: Restore version 1.0 slice
        run: >-
          dotnet restore Ssalddel.v1.0.slnx
          --artifacts-path artifacts/build/v1
          --property:Configuration=Release

      - name: Restore version 1.5 slice
        run: >-
          dotnet restore Ssalddel.v1.5.slnx
          --artifacts-path artifacts/build/v15
          --property:Configuration=Release

      - name: Restore version 3.5 deployment target
        run: >-
          dotnet restore Ssalddel.v3.5.slnx
          --artifacts-path artifacts/build/v35
          --property:Configuration=Release

      - name: Build version 0.0 slice
        run: >-
          dotnet build Ssalddel.v0.0.slnx
          --artifacts-path artifacts/build/v0
          --configuration Release
          --no-restore
          --verbosity minimal
          -p:ContinuousIntegrationBuild=true
          -p:UseSharedCompilation=false

      - name: Build version 0.5 slice
        run: >-
          dotnet build Ssalddel.v0.5.slnx
          --artifacts-path artifacts/build/v05
          --configuration Release
          --no-restore
          --verbosity minimal
          -p:ContinuousIntegrationBuild=true
          -p:UseSharedCompilation=false

      - name: Build version 1.0 slice
        run: >-
          dotnet build Ssalddel.v1.0.slnx
          --artifacts-path artifacts/build/v1
          --configuration Release
          --no-restore
          --verbosity minimal
          -p:ContinuousIntegrationBuild=true
          -p:UseSharedCompilation=false

      - name: Build version 1.5 slice
        run: >-
          dotnet build Ssalddel.v1.5.slnx
          --artifacts-path artifacts/build/v15
          --configuration Release
          --no-restore
          --verbosity minimal
          -p:ContinuousIntegrationBuild=true
          -p:UseSharedCompilation=false

      - name: Build version 3.5 deployment target
        run: >-
          dotnet build Ssalddel.v3.5.slnx
          --artifacts-path artifacts/build/v35
          --configuration Release
          --no-restore
          --verbosity minimal
          -p:ContinuousIntegrationBuild=true
          -p:UseSharedCompilation=false

      - name: Run full test suite
        run: >-
          dotnet test Ssalddel.Tests/Ssalddel.Tests.csproj
          --artifacts-path artifacts/build/v35
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=ssalddel-tests.trx"
          --results-directory artifacts/test-results

      - name: Publish server
        run: >-
          dotnet publish Ssalddel/Ssalddel.csproj
          --artifacts-path artifacts/build/v35
          --configuration Release
          --no-restore
          --output artifacts/publish/server
          -p:ContinuousIntegrationBuild=true
          -p:UseAppHost=false

      - name: Publish web client
        run: >-
          dotnet publish Ssalddel.WebApp/Ssalddel.WebApp.csproj
          --artifacts-path artifacts/build/v35
          --configuration Release
          --no-restore
          --output artifacts/publish/web
          -p:ContinuousIntegrationBuild=true

      - name: Publish 3.5 admin workbench
        run: >-
          dotnet publish SsalddelAdmin/SsalddelAdmin.csproj
          --artifacts-path artifacts/build/v35
          --configuration Release
          --no-restore
          --output artifacts/publish/admin
          -p:ContinuousIntegrationBuild=true
          -p:UseAppHost=false

      - name: Upload release-readiness outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-readiness-${{ github.run_number }}
          path: |
            artifacts/publish/
            artifacts/test-results/
          if-no-files-found: error
          retention-days: 14

  container-readiness:
    name: Compose, container, and 3.5 deployment bundle
    needs: version-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build server container
        run: docker build --file Ssalddel/Dockerfile --tag ssalddel-server:azure-preview .

      - name: Verify deployment and APK guard fixtures without external services
        shell: pwsh
        run: ./eng/staging/Test-AzureMobileHardening.ps1

      - name: Validate Azure 3.5 Compose profile
        env:
          SSALDDEL_MYSQL_ROOT_PASSWORD: readiness-root-password
          SSALDDEL_MYSQL_PASSWORD: readiness-app-password
          SSALDDEL_MONGO_PASSWORD: readiness-mongo-password
          SSALDDEL_SITE_HOST: readiness.example.test
          SSALDDEL_JWT_SECRET_KEY: readiness-jwt-secret-key-with-at-least-32-bytes
          SSALDDEL_DATA_PROTECTION_CERTIFICATE_PASSWORD: readiness-certificate-password
          SSALDDEL_ISMS_P_AES_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          SSALDDEL_ISMS_P_HASH_SALT: readiness-hash-salt
          SSALDDEL_STORAGE_ACCOUNT_NAME: readinessstorage
        run: >-
          docker compose
          -f deploy/azure-vm/compose.yaml
          -f deploy/azure-vm/compose.mart-v35.override.yaml
          config --quiet

      - name: Download published server and web
        uses: actions/download-artifact@v4
        with:
          name: release-readiness-${{ github.run_number }}
          path: artifacts/release-readiness

      - name: Validate isolated food mobile Compose profile
        env:
          SSALDDEL_MYSQL_ROOT_PASSWORD: readiness-root-password
          SSALDDEL_MYSQL_PASSWORD: readiness-app-password
          SSALDDEL_MONGO_PASSWORD: readiness-mongo-password
          SSALDDEL_SITE_HOST: readiness.example.test
          SSALDDEL_JWT_SECRET_KEY: readiness-jwt-secret-key-with-at-least-32-bytes
          SSALDDEL_DATA_PROTECTION_CERTIFICATE_PASSWORD: readiness-certificate-password
          SSALDDEL_ISMS_P_AES_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          SSALDDEL_ISMS_P_HASH_SALT: readiness-hash-salt
          SSALDDEL_STORAGE_ACCOUNT_NAME: readinessstorage
          SSALDDEL_FIELD_ADMIN_PASSWORD: readiness-admin-password
          SSALDDEL_FIELD_ORDERER_PASSWORD: readiness-orderer-password
          SSALDDEL_FIELD_RESTAURANT_PASSWORD: readiness-restaurant-password
          SSALDDEL_FIELD_DRIVER_PASSWORD: readiness-driver-password
        run: >-
          docker compose -p ssalddel-mobile-field-test
          -f deploy/azure-vm/compose.yaml
          -f deploy/azure-vm/compose.food-mobile-field-test.override.yaml
          config --quiet

      - name: Package Azure 3.5 deployment bundle
        run: |
          set -euo pipefail
          bundle="artifacts/mart-v35"
          test -f artifacts/release-readiness/web/wwwroot/index.html
          mkdir -p "$bundle"
          docker save --output "$bundle/ssalddel-server.tar" ssalddel-server:azure-preview
          tar -C artifacts/release-readiness/web/wwwroot -czf "$bundle/web.tar.gz" .
          cp deploy/azure-vm/compose.yaml "$bundle/compose.yaml"
          cp deploy/azure-vm/compose.mart-v35.override.yaml "$bundle/compose.mart-v35.override.yaml"
          cp deploy/azure-vm/Caddyfile "$bundle/Caddyfile"
          cp deploy/azure-vm/deploy-preview-profile.sh "$bundle/deploy-preview-profile.sh"
          cp deploy/azure-vm/deploy-mart-v35.sh "$bundle/deploy-mart-v35.sh"
          chmod +x "$bundle/deploy-preview-profile.sh" "$bundle/deploy-mart-v35.sh"
          test -s "$bundle/ssalddel-server.tar"
          test -s "$bundle/web.tar.gz"

      - name: Package isolated food mobile field-test bundle
        shell: pwsh
        run: >-
          ./deploy/azure-vm/package-mobile-field-test.ps1
          -ServerImageArchive artifacts/mart-v35/ssalddel-server.tar
          -WebArchive artifacts/mart-v35/web.tar.gz
          -OutputDirectory artifacts/food-mobile-field-test

      - name: Upload isolated food mobile field-test bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: food-mobile-field-test-deployment-${{ github.run_number }}
          path: artifacts/food-mobile-field-test/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Azure 3.5 deployment bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mart-v35-deployment-${{ github.run_number }}
          path: artifacts/mart-v35/
          if-no-files-found: error
          retention-days: 14

  runtime-integration:
    name: MySQL, MongoDB, and Redis integration
    needs: version-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-root-password
          MYSQL_DATABASE: ssalddel_integration
          MYSQL_USER: ssalddel
          MYSQL_PASSWORD: integration-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pintegration-root-password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore integration tests
        run: dotnet restore Ssalddel.Tests/Ssalddel.Tests.csproj

      - name: Exercise runtime stores and migrations
        env:
          SSALDDEL_INFRA_INTEGRATION_REQUIRED: "true"
          SSALDDEL_TEST_MYSQL_CONNECTION: server=127.0.0.1;port=3306;database=ssalddel_integration;user=ssalddel;password=integration-password;
          SSALDDEL_TEST_MONGODB_CONNECTION: mongodb://127.0.0.1:27017
          SSALDDEL_TEST_MONGODB_DATABASE: ssalddel_integration
          SSALDDEL_TEST_REDIS_CONNECTION: 127.0.0.1:6379,abortConnect=false
        run: >-
          dotnet test Ssalddel.Tests/Ssalddel.Tests.csproj
          --configuration Release
          --no-restore
          --filter "FullyQualifiedName~RuntimeInfrastructureIntegrationTests"
          --logger "trx;LogFileName=runtime-integration.trx"
          --results-directory artifacts/runtime-integration
          -p:UseSharedCompilation=false

      - name: Upload runtime integration evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-integration-${{ github.run_number }}
          path: artifacts/runtime-integration/
          if-no-files-found: error
          retention-days: 14

  browser-e2e:
    name: Browser E2E for 1.5 trade ledgers
    needs: version-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore WebAssembly workloads
        run: dotnet workload restore Ssalddel.WebApp/Ssalddel.WebApp.csproj

      - name: Build web client
        run: >-
          dotnet build Ssalddel.WebApp/Ssalddel.WebApp.csproj
          --configuration Release
          --verbosity minimal
          -p:ContinuousIntegrationBuild=true
          -p:UseSharedCompilation=false

      - name: Install browser test dependencies
        working-directory: eng/e2e
        run: npm install --ignore-scripts

      - name: Install Chromium
        working-directory: eng/e2e
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser E2E
        working-directory: eng/e2e
        run: npx playwright test

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-e2e-${{ github.run_number }}
          path: artifacts/browser-e2e/
          if-no-files-found: warn
          retention-days: 14
